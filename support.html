<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка — Games Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/responsive.css">
    <style>
        .support-container { max-width: 800px; margin: 0 auto; padding: 15px; padding-bottom: 90px; box-sizing: border-box; }
.chat-box { background: #1e1e1e; border-radius: 12px; border: 1px solid #2a2a2a; height: 55vh; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 80px; }
        .chat-header { padding: 15px; background: #2a2a2a; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; }
.chat-messages { flex: 1; padding: 15px; padding-bottom: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.chat-input-area { position: fixed; bottom: 70px; left: 0; right: 0; width: 100%; max-width: 800px; margin: 0 auto; padding: 10px 15px; background: #1e1e1e; border-top: 1px solid #333; display: flex !important; gap: 10px; z-index: 9999; box-sizing: border-box; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .msg.mine { align-self: flex-end; background: #2196f3; color: #fff; border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: #2a2a2a; color: #fff; border-bottom-left-radius: 2px; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: #fff; outline: none; font-size: 16px; }
        .chat-input-area button { padding: 12px 20px; background: #2196f3; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="/" class="logo"><i class="fas fa-gamepad"></i> <span>Games Shop</span></a>
            <nav class="nav-actions">
                <a href="/" style="color: #fff; font-size: 22px; text-decoration: none; padding: 5px;"><i class="fas fa-arrow-left"></i></a>
            </nav>
        </div>
    </header>

    <main class="support-container">
        <h2 style="color: #fff; margin-bottom: 20px;"><i class="fas fa-headset"></i> Техподдержка</h2>
        
        <div class="chat-box">
            <div class="chat-header">
                <div style="width: 40px; height: 40px; background: #2196f3; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;"><i class="fas fa-robot"></i></div>
                <div>
                    <div style="color: #fff; font-weight: bold;">Служба поддержки</div>
                    <div style="color: #4caf50; font-size: 12px;">● Онлайн</div>
                </div>
            </div>
            
            <div class="chat-messages" id="supportMessages">
                <div style="text-align: center; color: #888; margin-top: 20px;">Загрузка сообщений...</div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="supportInput" placeholder="Опишите вашу проблему..." autocomplete="off">
                <button id="supportSendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <script type="module" src="/src/js/support.js"></script>
</body>
</html>
