<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Games Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/modal.css">
    <link rel="stylesheet" href="/src/css/responsive.css">
    <style>
        /* ЖЕСТКИЙ ФИКС МЕНЮ (ПОВЕРХ ВСЕГО) */
        .profile-menu-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(4px) !important;
            z-index: 99999 !important;
            display: none !important;
            justify-content: flex-end !important;
        }
        .profile-menu-overlay.open {
            display: flex !important;
        }
        .profile-menu-panel {
            width: 320px;
            max-width: 85vw;
            height: 100%;
            background: #121212;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<script>
    window.onerror = function(msg) {
        const div = document.createElement('div');
        div.style = "position:fixed; top:0; left:0; right:0; background:red; color:white; z-index:999999; padding:15px; font-size:14px; font-weight:bold; text-align:center;";
        div.textContent = "ОШИБКА JS: " + msg;
        document.body.appendChild(div);
    };
</script>
<body>

<!-- МЕНЮ (ПО ЦЕНТРУ ЭКРАНА) -->
<!-- МЕНЮ (МОДАЛЬНОЕ ОКНО) -->
<div class="profile-menu-overlay" id="profileMenu">
    <div class="profile-menu-panel">
        
        <!-- Шапка меню (не скроллится) -->
        <div style="padding: 20px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0; font-size: 20px; color: #fff;">Настройки</h2>
            <button id="profileMenuClose" style="background: none; border: none; color: #888; font-size: 24px; cursor: pointer;"><i class="fas fa-times"></i></button>
        </div>

        <!-- Контент меню (скроллится) -->
        <div style="padding: 20px; overflow-y: auto; flex: 1;">
            <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
                <div id="menuAvatar" style="width: 70px; height: 70px; background: #2196f3; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #fff; overflow: hidden; margin-bottom: 10px;">?</div>
                <button id="menuChangeAvatar" style="background: none; border: none; color: #00e5ff; font-size: 13px; cursor: pointer;">Изменить фото</button>
                <input type="file" id="menuAvatarInput" accept="image/*" style="display: none;">
            </div>

            <div style="background: #121212; padding: 12px; border-radius: 8px; margin-bottom: 20px;">
                <div style="color: #888; font-size: 12px; margin-bottom: 4px;">Email</div>
                <div id="menuEmail" style="color: #fff; font-size: 14px;">—</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="color: #fff; font-size: 14px;">Уведомления</span>
                <label class="gs-switch">
                    <input type="checkbox" id="menuNotificationsToggle" checked>
                    <span class="gs-slider"></span>
                </label>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <span style="color: #fff; font-size: 14px;">Защита средств</span>
                <label class="gs-switch">
                    <input type="checkbox" id="menuProtectionToggle">
                    <span class="gs-slider"></span>
                </label>
            </div>

            <a href="/support.html" style="display: block; color: #00e5ff; text-decoration: none; font-size: 14px; margin-bottom: 10px;"><i class="fas fa-headset"></i> Написать в поддержку</a>
        </div>

        <!-- Подвал меню (кнопка выхода всегда внизу) -->
        <div style="padding: 20px; border-top: 1px solid #2a2a2a; background: #181818; border-radius: 0 0 16px 16px;">
            <button id="menuLogout" style="width: 100%; padding: 12px; background: rgba(244,67,54,0.1); color: #f44336; border: 1px solid #f44336; border-radius: 8px; font-weight: bold; cursor: pointer;">
                Выйти из профиля
            </button>
        </div>
        
    </div>
</div>

<!-- ШАПКА -->
<header class="profile-topbar">
<button class="profile-menu-btn" id="profileMenuBtn" onclick="document.getElementById('profileMenu').style.display='flex'">
        <i class="fas fa-bars"></i>
    </button>
    <div class="profile-topbar-title">Профиль</div>
    <div id="headerAdminBtn" style="min-width: 40px; display: flex; justify-content: flex-end;"></div>
</header>

<!-- КОНТЕНТ -->
<main id="profileMain">
    <div class="container" style="padding-top:20px;padding-bottom:30px;">
        <div style="text-align:center;padding:60px 0;color:var(--text-dim);">
            <i class="fas fa-spinner fa-spin" style="font-size:32px;"></i>
            <div style="margin-top:12px;">Загрузка профиля...</div>
        </div>
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="/src/js/profile.js"></script>
</body>
</html>
