<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар — Games Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/modal.css">
    <link rel="stylesheet" href="/src/css/responsive.css">
</head>
<body>

<header>
    <div class="container header-inner">
        <a href="/" class="logo"><i class="fas fa-gamepad"></i><span>Games Shop</span></a>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Поиск игр, аккаунтов, валюты...">
        </div>
        <nav class="nav-actions">
            <span id="authSlot"></span>
            <a href="/" class="btn btn-outline"><i class="fas fa-arrow-left"></i> <span>Назад</span></a>
        </nav>
    </div>
</header>

<main id="productMain">
    <div class="container" style="padding-top:20px;padding-bottom:30px;">
        <div style="text-align:center;padding:60px 0;color:var(--text-dim);">
            <i class="fas fa-spinner fa-spin" style="font-size:32px;"></i>
            <div style="margin-top:12px;">Загрузка товара...</div>
        </div>
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>
<!-- Модалка подтверждения покупки -->
<div id="buyModal" class="custom-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
    <div style="background: #1e1e1e; border: 1px solid #333; width: 90%; max-width: 400px; border-radius: 16px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <div style="width: 60px; height: 60px; background: rgba(0, 229, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; color: #00e5ff; font-size: 30px;">
            <i class="fas fa-shopping-cart"></i>
        </div>
        <h3 style="color: #fff; margin: 0 0 10px 0; font-size: 20px;">Подтверждение покупки</h3>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;" id="buyModalText">Вы уверены, что хотите купить этот товар?</p>
        <div style="display: flex; gap: 10px;">
            <button onclick="document.getElementById('buyModal').style.display='none'" style="flex: 1; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Отмена</button>
            <button id="confirmBuyBtn" style="flex: 1; padding: 12px; background: #00e5ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Оплатить</button>
        </div>
    </div>
</div>
<script type="module" src="/src/js/product.js"></script>
</body>
</html>
