<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Games Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        .admin-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .admin-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
        .admin-card h3 { font-size: 24px; color: #10b981; margin-bottom: 4px; }
        .admin-card p { font-size: 12px; color: var(--text-dim); }
        .admin-user-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .admin-user-row:last-child { border-bottom: none; }
        .admin-user-info h4 { color: white; font-size: 14px; }
        .admin-user-info p { color: var(--text-dim); font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div class="container header-inner">
        <a href="/" class="logo"><i class="fas fa-gamepad"></i><span>Games Shop</span></a>
        <nav class="nav-actions">
            <a href="/" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Назад</a>
        </nav>
    </div>
</header>

<main class="container" style="padding-top:20px; padding-bottom:40px;">
    <h1 style="color:white; margin-bottom:20px;">👑 Админ-панель</h1>
    
    <!-- Статистика -->
    <div class="admin-stats" id="statsContainer">
        <div class="admin-card"><h3>-</h3><p>Пользователей</p></div>
        <div class="admin-card"><h3>-</h3><p>Сделок</p></div>
        <div class="admin-card"><h3>-</h3><p>Комиссия (₽)</p></div>
        <div class="admin-card"><h3>-</h3><p>Товаров</p></div>
    </div>

    <!-- Список юзеров -->
    <div class="admin-card" style="text-align:left; padding:0;">
        <div style="padding:16px; border-bottom:1px solid var(--border);">
            <h3 style="font-size:16px; color:white;">Пользователи</h3>
        </div>
        <div id="usersList"></div>
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>
<script type="module" src="/src/js/admin.js"></script>
</body>
</html>
