<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет — Games Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/modal.css">
    <link rel="stylesheet" href="/src/css/responsive.css">
    <style>
        .dash-header { background: var(--bg-2); border-bottom: 1px solid var(--border); padding: 16px 0; }
        .dash-header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .dash-tabs { display: flex; gap: 6px; margin: 24px 0 16px; overflow-x: auto; padding-bottom: 4px; }
        .dash-tab { padding: 10px 18px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 30px; cursor: pointer; white-space: nowrap; color: var(--text-dim); font-weight: 600; font-size: 14px; }
        .dash-tab.active { background: linear-gradient(135deg, #3b82f6, #7c3aed); color: white; border-color: transparent; }
        .dash-panel { display: none; }
        .dash-panel.active { display: block; }
        .card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 16px; }
        .card h3 { font-size: 18px; margin-bottom: 14px; color: white; }
        .wallet-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
        .wallet-row input { flex: 1; min-width: 140px; padding: 12px 14px; background: #0e141d; border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 15px; outline: none; }
        .list-item { background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .list-item .info h4 { font-size: 15px; color: white; margin-bottom: 4px; }
        .list-item .info p { font-size: 13px; color: var(--text-dim); }
        .tag { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .tag.pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        .tag.completed { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .tag.cancelled { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .empty { color: var(--text-dim); text-align: center; padding: 30px 0; }
        .avatar-wrap { position: relative; width: 100px; height: 100px; }
        .avatar-wrap img, .avatar-wrap .avatar-placeholder {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary);
        }
        .avatar-wrap .avatar-placeholder {
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: 700; color: white;
        }
        .avatar-upload { position: absolute; bottom: 0; right: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; border: 2px solid var(--bg-2); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
        .avatar-upload input { display: none; }
        .star-picker { display: flex; gap: 6px; font-size: 28px; cursor: pointer; }
        .star-picker i { color: #4a5568; transition: 0.15s; }
        .star-picker i.active { color: #fbbf24; }
    </style>
</head>
<div class="modal-overlay" id="chatModal">
    <div class="modal" style="max-width:520px;display:flex;flex-direction:column;max-height:85vh;">
        <button class="modal-close" id="chatClose"><i class="fas fa-times"></i></button>
        <h2 class="modal-title" id="chatTitle"><i class="fas fa-comments"></i> Чат</h2>
        <div id="chatSubtitle" style="color:var(--text-dim);font-size:13px;margin-bottom:10px;"></div>

        <div class="chat-messages" id="chatMessages" style="flex:1;overflow-y:auto;min-height:300px;max-height:50vh;padding:10px;background:#0e141d;border-radius:14px;border:1px solid var(--border);margin-bottom:10px;"></div>
        <div id="chatTyping" style="height:18px;font-size:12px;color:var(--text-dim);opacity:0;transition:opacity 0.2s;margin-bottom:6px;"></div>

        <form id="chatForm" style="display:flex;gap:8px;">
            <input type="text" id="chatInput" placeholder="Напишите сообщение..." autocomplete="off"
                style="flex:1;padding:12px;background:#0e141d;border:1px solid var(--border);border-radius:12px;color:white;font-size:15px;outline:none;">
            <button type="submit" class="btn btn-primary" style="padding:12px 16px;">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>
<body class="wallet-page-body">

<!-- ВЕРХНЯЯ ПАНЕЛЬ -->
<header class="wallet-header">
    <a href="/profile.html" class="wallet-back" id="walletBack">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="wallet-title">Баланс</div>
    <div class="wallet-spacer"></div>
</header>

<main>
    <div class="container" style="padding-top:16px;padding-bottom:30px;">
        <!-- Табы Пополнение / Выплата -->
        <div class="wallet-tabs">
            <button class="wallet-tab active" data-wallet-tab="deposit">Пополнение</button>
            <button class="wallet-tab" data-wallet-tab="withdraw">Выплата</button>
        </div>

        <!-- Баланс -->
        <div class="wallet-balance-card">
            <span class="wallet-balance-icon">💳</span>
            <div class="wallet-balance-info">
                <div class="wallet-balance-label">Баланс</div>
                <div class="wallet-balance-value" id="balanceValue">0 ₽</div>
            </div>
        </div>

        <!-- Форма Пополнения -->
        <div class="wallet-panel active" id="walletPanel-deposit">
            <input type="number" id="depositAmount" class="wallet-input" placeholder="Сумма пополнения" min="1">
            <button class="wallet-submit" id="depositBtn">Пополнить баланс</button>
        </div>

        <!-- Форма Выплаты -->
        <div class="wallet-panel" id="walletPanel-withdraw">
            <div class="wallet-available">
                <span class="wallet-available-icon">💰</span>
                <div>
                    <div class="wallet-available-label">Доступно к выплате</div>
                    <div class="wallet-available-value" id="availableValue">0 ₽</div>
                </div>
            </div>
            <input type="number" id="withdrawAmount" class="wallet-input" placeholder="Сумма выплаты" min="100">
            <button class="wallet-submit" id="withdrawBtn">Создать выплату</button>
            <div class="wallet-protection">
                <span>🔒 Защита средств</span>
                <span class="wallet-new-badge">Новое</span>
            </div>
        </div>

        <!-- История -->
        <div class="wallet-history-header">
            <h3>История</h3>
            <button class="wallet-sort" id="walletSortBtn">
                Дата <i class="fas fa-chevron-down" id="walletSortIcon"></i>
            </button>
        </div>

        <div class="wallet-filters">
            <button class="wallet-filter" data-filter="op"><i class="fas fa-list"></i></button>
            <button class="wallet-filter" data-filter="type">Операция</button>
            <button class="wallet-filter" data-filter="amount">Сумма</button>
            <button class="wallet-filter" data-filter="method">Способ</button>
        </div>

        <div class="wallet-tx-list" id="txList"></div>
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="/src/js/wallet-page.js"></script>
<!-- МОДАЛКА ТРАНЗАКЦИИ -->
<div class="modal-overlay" id="txModal">
    <div class="modal tx-modal-content">
        <button class="modal-close" id="txModalClose"><i class="fas fa-times"></i></button>

        <div class="tx-modal-date" id="txDate"></div>

        <div class="tx-modal-icon" id="txIcon">💰</div>
        <div class="tx-modal-title" id="txTitle">Операция</div>
        <div class="tx-modal-amount" id="txAmount">0 ₽</div>

        <div class="tx-modal-rows">
            <div class="tx-row">
                <span class="tx-label">Способ</span>
                <span class="tx-value" id="txMethod">—</span>
            </div>
            <div class="tx-row">
                <span class="tx-label">Статус</span>
                <span class="tx-value" id="txStatus">—</span>
            </div>
            <div class="tx-row">
                <span class="tx-label">Тип операции</span>
                <span class="tx-value" id="txType">—</span>
            </div>
        </div>

        <div class="tx-modal-footer" id="txFooter">
            Средства зачислены на баланс
        </div>
    </div>
</div>

</body>
</html>
