<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | Games Shop</title>
  <style>
    body { background: #121212; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .tab-btn { background: #1e1e1e; color: #aaa; border: 1px solid #333; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .tab-btn:hover { background: #2a2a2a; color: #fff; }
    .tab-btn.active { background: #2196f3; color: #fff; border-color: #2196f3; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #333; }
    .card h3 { margin: 0 0 10px 0; color: #888; font-size: 14px; font-weight: normal; }
    .card .value { font-size: 24px; font-weight: bold; color: #4caf50; }
    .card.warning .value { color: #f44336; }
    table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #2a2a2a; color: #aaa; font-size: 12px; text-transform: uppercase; }
    tr.banned { opacity: 0.6; }
    .btn { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-ban { background: #f44336; color: #fff; }
    .btn-unban { background: #4caf50; color: #fff; }
    .btn-mod { background: #ff9800; color: #fff; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .search, .sort { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #1e1e1e; color: #fff; }
    .search { flex: 1; min-width: 200px; }
    .sort { width: 200px; }
    a { color: #2196f3; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Панель управления</h2>
    <a href="/">← На главную</a>
  </div>

<div class="tabs">
    <button class="tab-btn active" data-tab="stats">📊 Статистика</button>
    <button class="tab-btn" data-tab="users">👥 Пользователи</button>
    <button class="tab-btn" data-tab="disputes">⚖️ Споры</button>
    <button class="tab-btn" data-tab="support">🆘 Поддержка</button> <!-- ВОТ ЭТА СТРОКА -->
</div>

  <!-- ВКЛАДКА: СТАТИСТИКА -->
  <div id="tab-stats" class="tab-content active">
    <div class="grid" id="stats-container">
      <div class="card"><h3>Загрузка...</h3></div>
    </div>
  </div>

  <!-- ВКЛАДКА: ПОЛЬЗОВАТЕЛИ -->
  <div id="tab-users" class="tab-content">
    <div class="controls">
      <input type="text" id="search" class="search" placeholder="Поиск по ID, нику или email...">
      <select id="sort" class="sort">
        <option value="id-desc">Сначала новые</option>
        <option value="id-asc">Сначала старые</option>
        <option value="balance-desc">По балансу (убывание)</option>
        <option value="balance-asc">По балансу (возрастание)</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Юзер</th>
          <th>Email</th>
          <th>Баланс</th>
          <th>Статус</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody id="users-list"></tbody>
    </table>
  </div>

  <!-- ВКЛАДКА: СПОРЫ -->
  <div id="tab-disputes" class="tab-content">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Товар</th>
          <th>Покупатель</th>
          <th>Продавец</th>
          <th>Сумма</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody id="disputes-list"></tbody>
    </table>
  </div>

<!-- ВКЛАДКА: ПОДДЕРЖКА -->
<div id="tab-support" class="tab-content">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Пользователь</th>
        <th>Последнее сообщение</th>
        <th>Действие</th>
      </tr>
    </thead>
    <tbody id="support-list">
      <tr><td colspan="4" style="text-align:center;">Загрузка...</td></tr>
    </tbody>
  </table>
</div>

<!-- МОДАЛЬНОЕ ОКНО ЧАТА -->
<div id="supportModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
  <div style="background:#1e1e1e; width:100%; max-width:500px; height:80vh; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; border:1px solid #333;">
    <div style="padding:15px; background:#2a2a2a; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
      <h3 id="supportUserName" style="margin:0; color:#fff; font-size:16px;">Пользователь</h3>
      <button onclick="document.getElementById('supportModal').style.display='none'" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;"><i class="fas fa-times"></i>✖</button>
    </div>
    <div id="supportChatMessages" style="flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; background:#121212;"></div>
    <div style="padding:10px; background:#2a2a2a; display:flex; gap:10px;">
      <input type="text" id="adminSupportInput" placeholder="Ответить..." style="flex:1; padding:10px; border-radius:8px; border:none; background:#121212; color:#fff; outline:none;">
      <button id="adminSupportSend" style="padding:10px 15px; background:#2196f3; color:#fff; border:none; border-radius:8px; cursor:pointer;">Отправить</button>
    </div>
  </div>
</div>

  <script src="/admin.js"></script>
</body>
</html>
