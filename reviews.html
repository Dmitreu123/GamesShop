<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы — Games Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
<link rel="stylesheet" href="/src/css/modal.css">
<link rel="stylesheet" href="/src/css/responsive.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="/" class="logo"><i class="fas fa-gamepad"></i> <span>Games Shop</span></a>
            <nav class="nav-actions">
                <a href="/profile.html" class="btn btn-outline" id="backBtn"><i class="fas fa-arrow-left"></i> Назад</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 20px; padding-bottom: 50px;">
        <h2 style="color:white; margin-bottom: 20px;">Отзывы</h2>
        
        <!-- Блок статистики -->
        <div id="reviewStats" style="display:flex; align-items:center; gap:20px; margin-bottom:30px;">
            <div style="font-size:48px; font-weight:bold; color:#fff;" id="avgRating">5.0</div>
            <div>
                <div style="color:#2196f3; font-size:24px; margin-bottom:5px;" id="starsDisplay">★★★★★</div>
                <div style="color:#888; font-size:14px;" id="totalCount">0 отзывов</div>
            </div>
        </div>

        <!-- Список отзывов -->
        <div id="reviewsList">
            <div style="text-align:center; padding:40px; color:#888;"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
        </div>
    </main>

    <script type="module" src="/src/js/reviews.js"></script>
</body>
</html>
